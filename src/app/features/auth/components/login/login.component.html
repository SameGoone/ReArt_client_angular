<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Login to Your Account</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email"
               [ngClass]="{'invalid-field': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">

        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email address.</small>
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password"
               [ngClass]="{'invalid-field': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">

        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</small>
        </div>
      </div>

      <div *ngIf="loginError" class="error-message api-error">
        {{ loginError }}
      </div>

      <button type="submit" class="submit-button" [disabled]="isSubmitting || loginForm.invalid">
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <div class="switch-form-link">
      Need an account? <a routerLink="/auth/register">Sign Up</a>
    </div>
  </div>
</div>
